# DT-19: Workflow de CI — typecheck + tests + build en cada push/PR.
name: CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependencias del sistema (para better-sqlite3)
        run: sudo apt-get install -y python3 build-essential

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/ferred
        run: npx prisma generate

      - name: Typecheck renderer
        working-directory: apps/renderer
        run: npx tsc --noEmit

      - name: Typecheck server
        working-directory: apps/server
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Tests unitarios renderer
        working-directory: apps/renderer
        run: pnpm test --run

  build-renderer:
    name: Build renderer
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm build:renderer
